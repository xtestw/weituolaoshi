server {
    listen 443 ssl;
    listen [::]:443 ssl;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_name wtls.xtestw.com;
    client_max_body_size 6m;
    location = / { return 302 /admin/index.html; }
    location = /admin { return 302 /admin/index.html; }
    location = /admin/ { return 302 /admin/index.html; }
    location / {
        proxy_pass http://127.0.0.1:18083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Demo-User "";
        proxy_read_timeout 120s;
    }

    ssl_certificate /etc/letsencrypt/live/wtls.xtestw.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/wtls.xtestw.com/privkey.pem; # managed by Certbot
}
server {
    if ($host = wtls.xtestw.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name wtls.xtestw.com;
    return 404; # managed by Certbot


}