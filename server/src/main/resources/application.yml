server:
  port: 8080
spring:
  config:
    import: optional:file:./config/application-private.yml,optional:file:./server/config/application-private.yml
  datasource:
    url: jdbc:h2:file:./data/weituolaoshi;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ''
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
wechat:
  app-id: ''
  app-secret: ''
account:
  avatar-directory: ./data/avatars
messages:
  media-directory: ./data/messages
posts:
  media-directory: ./data/posts
identity:
  # Test-only ID numbers that skip face verification; gender exceptions are separate.
  face-check-whitelist: ''
  # Comma-separated test ID numbers; bypass gender checks only. Restart after changes.
  gender-check-whitelist: ''
  digest-key: ''
admin:
  bootstrap-user: ''
  bootstrap-password: ''

faceid:
  secret-id: ''
  secret-key: ''
  rule-id: ''
  region: ap-guangzhou
